<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SAFapp</title>
    <link rel="stylesheet" href="CSS/Login.css">
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form action="#" method="post">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" placeholder="Digite o seu Email" name="usuario" required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite a sua senha" required>
            <input type="submit" value="Entrar">
            <a href="cadastro.html" class="btn-cadastro">Cadastrar</a>
        </form>
    </div>
</body>
</html>
