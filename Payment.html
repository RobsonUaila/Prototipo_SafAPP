<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - SAFapp</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="CSS/Paymen.Css">
</head>

<body>
    <div class="pagamentos-container">
        <h2>Escolha o Método de Pagamento</h2>

                <img src="img/Visa.png" alt="Visa" />

                <img src="img/Emola.png" alt="Emola" />

            <div class="metodo">
                <img src="img/paypal.png" alt="PayPal" style="height:32px" />

            </div>
            <div class="metodo">
                <img src="img/download.png" alt="Mpesa" style="height:32px" />
                <span>Mpesa</span>
            </div>
        </div>
        <a href="login.html" class="btn-voltar">Voltar</a>
    </div>

</html>
