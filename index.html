<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aluguer de Filmes</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="logo">🎥 Sistema de Aluguer de Filmes</h1>
            </div>

            <div class="menu"> 
                <a href="#">Início</a>
                <a href="#">Catálogo</a>
                <a id="botao" href="login.html">Login/Cadastro</a>
            </div>
        </nav>
    </header>

    <section class="catalogo">
        <div class="filme">
            <img src="img/download.jpg" alt="Filme 1">
            <div class="filme-info">
                <h3>Filme 1</h3>
                <p>Gênero: Ação<br>Ano: 2023</p>
                <a href="Payment.html" class="botao-alugar">Alugar</a>
            </div>
        </div>
        <div class="filme">
            <img src="img/images.jpg" alt="Filme 2">
            <div class="filme-info">
                <h3>Filme 2</h3>
                <p>Gênero: Comédia<br>Ano: 2022</p>
                <a href="Payment.html" class="botao-alugar">Alugar</a>
            </div>
        </div>
        <div class="filme">
            <img src="https://via.placeholder.com/300x400?text=Filme+3" alt="Filme 3">
            <div class="filme-info">
                <h3>Filme 3</h3>
                <p>Gênero: Drama<br>Ano: 2021</p>
                <a href="#" class="botao-alugar">Alugar</a>
            </div>
        </div>
    </section>
</body>

</html>
