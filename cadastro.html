<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SAFapp</title>
    <link rel="stylesheet" href="CSS/Login.css">
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="CSS/Cadastro.css">
</head>
<body>
    <div class="cadastro-container">
        <h2>Cadastro</h2>
        <form action="#" method="post">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" placeholder="Escolha um nome de usuário" required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
            <label for="confirma-senha">Confirme a Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Confirme a senha" required>
            <input type="submit" value="Cadastrar">
            <a href="login.html" class="btn-voltar">Voltar ao Login</a>
        </form>
    </div>
</body>
</html>
